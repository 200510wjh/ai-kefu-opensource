<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI客服 - 多平台智能客服系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0a0b14;
      --bg-secondary: #12131f;
      --bg-card: rgba(22, 24, 42, 0.6);
      --accent-cyan: #00d4ff;
      --accent-purple: #7b5cfa;
      --accent-pink: #ff6b9d;
      --accent-green: #00e5a0;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-tertiary: rgba(255, 255, 255, 0.4);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --glow-cyan: 0 0 40px rgba(0, 212, 255, 0.3);
      --glow-purple: 0 0 40px rgba(123, 92, 250, 0.3);
    }

    body {
      font-family: 'Inter', 'Space Grotesk', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    /* 动态粒子背景 */
    .particles-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: float 20s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.3; }
      25% { transform: translateY(-30px) translateX(20px) scale(1.1); opacity: 0.6; }
      50% { transform: translateY(-10px) translateX(-10px) scale(0.9); opacity: 0.4; }
      75% { transform: translateY(-40px) translateX(15px) scale(1.05); opacity: 0.5; }
    }

    /* 渐变光球 */
    .gradient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: orb-float 15s infinite ease-in-out;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
      top: -100px; right: -100px;
    }
    .orb-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(123, 92, 250, 0.12) 0%, transparent 70%);
      bottom: -150px; left: -150px;
      animation-delay: -5s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255, 107, 157, 0.1) 0%, transparent 70%);
      top: 50%; left: 50%;
      animation-delay: -10s;
    }
    @keyframes orb-float {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(30px, -30px); }
      66% { transform: translate(-20px, 20px); }
    }

    /* 主布局 */
    .app-layout {
      display: flex;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* 左侧导航 */
    .sidebar {
      width: 72px;
      background: rgba(18, 19, 31, 0.8);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 20px 0;
    }

    .sidebar-logo {
      padding: 8px 16px 24px;
      text-align: center;
    }
    .sidebar-logo .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      margin: 0 auto;
      box-shadow: var(--glow-cyan);
    }

    .nav-items { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 0 12px; }

    .nav-item {
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      background: transparent;
    }
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: scale(1.05);
    }
    .nav-item.active {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(123, 92, 250, 0.15));
      box-shadow: inset 0 0 0 1px rgba(0, 212, 255, 0.3);
    }
    .nav-item .icon { font-size: 20px; transition: transform 0.3s ease; }
    .nav-item:hover .icon { transform: scale(1.2); }
    .nav-item.active .icon { filter: drop-shadow(0 0 8px var(--accent-cyan)); }

    .nav-item .tooltip {
      position: absolute;
      left: 60px;
      background: var(--bg-secondary);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      border: 1px solid var(--border-subtle);
      z-index: 100;
    }
    .nav-item:hover .tooltip { opacity: 1; }

    /* 主内容区 */
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* 顶部栏 */
    .topbar {
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(18, 19, 31, 0.5);
      backdrop-filter: blur(20px);
    }
    .topbar-title {
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .topbar-status { display: flex; align-items: center; gap: 24px; }
    .status-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      background: rgba(0, 229, 160, 0.1);
      border: 1px solid rgba(0, 229, 160, 0.2);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent-green);
    }
    .status-dot {
      width: 6px; height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0, 229, 160, 0.4); }
      50% { opacity: 0.8; box-shadow: 0 0 0 6px transparent; }
    }

    /* 内容区 */
    .content-area {
      flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
    }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stat-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 212, 255, 0.3);
      box-shadow: var(--glow-cyan);
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .stat-card:hover::before { opacity: 1; }
    .stat-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      margin-bottom: 16px;
    }
    .stat-icon.cyan { background: rgba(0, 212, 255, 0.15); color: var(--accent-cyan); }
    .stat-icon.purple { background: rgba(123, 92, 250, 0.15); color: var(--accent-purple); }
    .stat-icon.pink { background: rgba(255, 107, 157, 0.15); color: var(--accent-pink); }
    .stat-icon.green { background: rgba(0, 229, 160, 0.15); color: var(--accent-green); }

    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* 数字滚动动画 */
    .count-up {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    /* 玻璃卡片 */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-title .icon { font-size: 20px; }

    /* 平台卡片网格 */
    .platform-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .platform-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .platform-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, transparent, rgba(0, 212, 255, 0.05));
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .platform-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
    }
    .platform-card:hover::before { opacity: 1; }
    .platform-card.connected { border-color: rgba(0, 229, 160, 0.3); }
    .platform-card.connected:hover { border-color: var(--accent-green); box-shadow: 0 0 40px rgba(0, 229, 160, 0.2); }

    .platform-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .platform-info { display: flex; align-items: center; gap: 14px; }
    .platform-icon {
      width: 52px; height: 52px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
    }
    .platform-name { font-size: 17px; font-weight: 600; margin-bottom: 2px; }
    .platform-sub { font-size: 12px; color: var(--text-secondary); }

    .platform-status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 107, 157, 0.15);
      color: var(--accent-pink);
      border: 1px solid rgba(255, 107, 157, 0.2);
      transition: all 0.3s ease;
    }
    .platform-status.connected {
      background: rgba(0, 229, 160, 0.15);
      color: var(--accent-green);
      border-color: rgba(0, 229, 160, 0.2);
    }
    .platform-status.connected::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse-dot 2s infinite;
    }

    .platform-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .platform-stat {
      text-align: center;
      padding: 14px 8px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      transition: all 0.3s ease;
    }
    .platform-stat:hover {
      background: rgba(0, 212, 255, 0.05);
      border-color: rgba(0, 212, 255, 0.2);
    }
    .platform-stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 2px;
    }
    .platform-stat-label { font-size: 11px; color: var(--text-tertiary); }

    /* 按钮 */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: white;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 30px rgba(0, 212, 255, 0.4);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn-danger {
      background: rgba(255, 107, 157, 0.15);
      color: var(--accent-pink);
      border: 1px solid rgba(255, 107, 157, 0.2);
    }
    .btn-danger:hover {
      background: rgba(255, 107, 157, 0.25);
    }
    .btn-sm { padding: 8px 14px; font-size: 12px; }

    .platform-actions { display: flex; gap: 10px; }

    /* 模态框 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.show { display: flex; opacity: 1; }
    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      padding: 36px;
      width: 480px;
      max-width: 90%;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-overlay.show .modal {
      transform: scale(1) translateY(0);
    }
    .modal h3 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .modal-close {
      position: absolute;
      top: 24px; right: 24px;
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .modal-close:hover { background: rgba(255, 107, 157, 0.2); color: var(--accent-pink); }

    /* 平台选择网格 */
    .platform-select {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .platform-option {
      padding: 24px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid var(--border-subtle);
      border-radius: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .platform-option:hover {
      background: rgba(0, 212, 255, 0.05);
      border-color: rgba(0, 212, 255, 0.3);
      transform: translateY(-2px);
    }
    .platform-option.selected {
      background: rgba(0, 212, 255, 0.1);
      border-color: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
    }
    .platform-option .icon { font-size: 40px; margin-bottom: 10px; display: block; }
    .platform-option .name { font-size: 14px; font-weight: 600; }

    /* 表单 */
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .form-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }
    .form-input::placeholder { color: var(--text-tertiary); }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .empty-state .icon { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
    .empty-state p { font-size: 15px; margin-bottom: 8px; }
    .empty-state small { font-size: 13px; color: var(--text-tertiary); }

    /* Toast 提示 */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      padding: 14px 24px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2000;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.success { border-color: var(--accent-green); color: var(--accent-green); }
    .toast.error { border-color: var(--accent-pink); color: var(--accent-pink); }
  </style>
</head>
<body>
  <!-- 动态背景 -->
  <div class="particles-bg" id="particles"></div>
  <div class="gradient-orb orb-1"></div>
  <div class="gradient-orb orb-2"></div>
  <div class="gradient-orb orb-3"></div>

  <div class="app-layout">
    <!-- 侧边栏 -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">🤖</div>
      </div>
      
      <div class="nav-items">
        <div class="nav-item active" data-page="dashboard">
          <span class="icon">📊</span>
          <span class="tooltip">控制台</span>
        </div>
        <div class="nav-item" data-page="stores">
          <span class="icon">🏪</span>
          <span class="tooltip">店铺管理</span>
        </div>
        <div class="nav-item" data-page="analytics">
          <span class="icon">📈</span>
          <span class="tooltip">数据分析</span>
        </div>
        <div class="nav-item" data-page="customers">
          <span class="icon">👥</span>
          <span class="tooltip">客户管理</span>
        </div>
        <div class="nav-item" data-page="config">
          <span class="icon">⚙️</span>
          <span class="tooltip">AI配置</span>
        </div>
        <div class="nav-item" data-page="knowledge">
          <span class="icon">📚</span>
          <span class="tooltip">知识库</span>
        </div>
      </div>
    </nav>

    <!-- 主内容 -->
    <main class="main-area">
      <!-- 顶部栏 -->
      <header class="topbar">
        <h1 class="topbar-title" id="topbar-title">控制台</h1>
        <div class="topbar-status">
          <div class="status-badge">
            <span class="status-dot"></span>
            <span>系统正常</span>
          </div>
        </div>
      </header>

      <!-- 内容区 -->
      <div class="content-area" id="content-area">
        <!-- 动态内容 -->
      </div>
    </main>
  </div>

  <!-- 添加店铺弹窗 -->
  <div class="modal-overlay" id="modal">
    <div class="modal" style="position:relative;">
      <button class="modal-close" onclick="closeModal()">×</button>
      <h3>添加店铺</h3>
      <div class="platform-select">
        <div class="platform-option" data-platform="douyin" onclick="selectPlatform(this)">
          <span class="icon">🐦</span>
          <span class="name">抖店</span>
        </div>
        <div class="platform-option" data-platform="xianyu" onclick="selectPlatform(this)">
          <span class="icon">🐟</span>
          <span class="name">闲鱼</span>
        </div>
        <div class="platform-option" data-platform="qianiu" onclick="selectPlatform(this)">
          <span class="icon">🐱</span>
          <span class="name">淘宝千牛</span>
        </div>
        <div class="platform-option" data-platform="kuaishou" onclick="selectPlatform(this)">
          <span class="icon">📺</span>
          <span class="name">快手</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">店铺名称</label>
        <input type="text" class="form-input" id="store-name" placeholder="输入店铺名称，如：我的抖店">
      </div>
      <div style="display:flex;gap:12px;margin-top:28px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" style="flex:1;" onclick="addStore()">确认添加</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ============== 状态 ==============
    let currentPage = 'dashboard';
    let stores = [];
    let selectedPlatform = null;
    let config = {};
    let stats = { total_messages: 0, ai_replies: 0, human_handoffs: 0, reply_rate: '0%' };
    let analyticsData = {};
    let customersData = { customers: [], leads: [] };

    // ============== 粒子背景 ==============
    function createParticles() {
      const container = document.getElementById('particles');
      const colors = ['#00d4ff', '#7b5cfa', '#ff6b9d', '#00e5a0'];
      
      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.cssText = `
          width: ${Math.random() * 6 + 2}px;
          height: ${Math.random() * 6 + 2}px;
          background: ${colors[Math.floor(Math.random() * colors.length)]};
          left: ${Math.random() * 100}%;
          top: ${Math.random() * 100}%;
          animation-delay: ${Math.random() * 20}s;
          animation-duration: ${Math.random() * 10 + 15}s;
        `;
        container.appendChild(particle);
      }
    }
    createParticles();

    // ============== 初始化 ==============
    async function init() {
      await loadStores();
      await loadConfig();
      await loadStats();
      await loadAnalytics();
      await loadCustomers();
      showPage('dashboard');
      setInterval(() => { loadStores(); loadStats(); loadAnalytics(); loadCustomers(); }, 30000);
    }

    async function loadStores() {
      try {
        const res = await fetch('/api/stores');
        const data = await res.json();
        stores = data.data?.stores || [];
        if (currentPage === 'dashboard' || currentPage === 'stores') render();
      } catch (e) { console.error(e); }
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        config = data.data?.config || {};
      } catch (e) { console.error(e); }
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        stats = data.data || stats;
        if (currentPage === 'dashboard') render();
      } catch (e) { console.error(e); }
    }

    // ============== 页面切换 ==============
    function showPage(page) {
      currentPage = page;
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.page === page);
      });
      const titles = { dashboard: '控制台', stores: '店铺管理', analytics: '数据分析', customers: '客户管理', config: 'AI配置', knowledge: '知识库' };
      document.getElementById('topbar-title').textContent = titles[page] || page;
      render();
    }

    function render() {
      const content = document.getElementById('content-area');
      switch (currentPage) {
        case 'dashboard': content.innerHTML = renderDashboard(); animateStats(); break;
        case 'stores': content.innerHTML = renderStores(); break;
        case 'analytics': content.innerHTML = renderAnalytics(); break;
        case 'customers': content.innerHTML = renderCustomers(); break;
        case 'config': content.innerHTML = renderConfig(); break;
        case 'knowledge': content.innerHTML = renderKnowledge(); break;
      }
    }

    // ============== 控制台 ==============
    function renderDashboard() {
      return `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon cyan">💬</div>
            <div class="stat-value" data-count="${stats.total_messages || 0}">${stats.total_messages || 0}</div>
            <div class="stat-label">总消息数</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple">🤖</div>
            <div class="stat-value" data-count="${stats.ai_replies || 0}">${stats.ai_replies || 0}</div>
            <div class="stat-label">AI回复数</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon pink">👤</div>
            <div class="stat-value" data-count="${stats.human_handoffs || 0}">${stats.human_handoffs || 0}</div>
            <div class="stat-label">转人工数</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">📈</div>
            <div class="stat-value">${stats.reply_rate || '0%'}</div>
            <div class="stat-label">回复率</div>
          </div>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <span class="card-title"><span class="icon">🏪</span> 店铺状态</span>
            <button class="btn btn-sm btn-primary" onclick="showPage('stores')">管理店铺</button>
          </div>
          <div class="platform-grid">
            ${stores.length === 0 ? `
              <div class="empty-state" style="grid-column:1/-1;">
                <div class="icon">🏪</div>
                <p>暂无店铺</p>
                <small>点击下方按钮添加你的第一个店铺</small>
              </div>
            ` : stores.map(store => `
              <div class="platform-card ${store.status === 'active' ? 'connected' : ''}">
                <div class="platform-header">
                  <div class="platform-info">
                    <div class="platform-icon">${getPlatformIcon(store.platform)}</div>
                    <div>
                      <div class="platform-name">${store.name}</div>
                      <div class="platform-sub">${getPlatformName(store.platform)}</div>
                    </div>
                  </div>
                  <span class="platform-status ${store.status === 'active' ? 'connected' : ''}">${store.status === 'active' ? '已连接' : '已断开'}</span>
                </div>
                <div class="platform-actions">
                  <button class="btn btn-sm btn-secondary" onclick="toggleStore('${store.id}')">${store.status === 'active' ? '禁用' : '启用'}</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteStore('${store.id}')">删除</button>
                </div>
              </div>
            `).join('')}
          </div>
          <div style="margin-top:24px;text-align:center;">
            <button class="btn btn-primary" onclick="openModal()">+ 添加店铺</button>
          </div>
        </div>
      `;
    }

    // ============== 店铺管理 ==============
    function renderStores() {
      return `
        <div class="glass-card">
          <div class="card-header">
            <span class="card-title"><span class="icon">🏪</span> 店铺管理</span>
            <button class="btn btn-primary" onclick="openModal()">+ 添加店铺</button>
          </div>
          <div class="platform-grid">
            ${stores.length === 0 ? `
              <div class="empty-state" style="grid-column:1/-1;">
                <div class="icon">🏪</div>
                <p>暂无店铺</p>
                <small>点击"添加店铺"连接你的第一个平台</small>
              </div>
            ` : stores.map(store => `
              <div class="platform-card ${store.status === 'active' ? 'connected' : ''}">
                <div class="platform-header">
                  <div class="platform-info">
                    <div class="platform-icon">${getPlatformIcon(store.platform)}</div>
                    <div>
                      <div class="platform-name">${store.name}</div>
                      <div class="platform-sub">${getPlatformName(store.platform)} · 添加于 ${new Date(store.created_at).toLocaleDateString('zh-CN')}</div>
                    </div>
                  </div>
                  <span class="platform-status ${store.status === 'active' ? 'connected' : ''}">${store.status === 'active' ? '已连接' : '已断开'}</span>
                </div>
                <div class="platform-actions">
                  <button class="btn btn-sm btn-secondary" onclick="toggleStore('${store.id}')">${store.status === 'active' ? '禁用' : '启用'}</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteStore('${store.id}')">删除</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ============== AI配置 ==============
    function renderConfig() {
      return `
        <div class="glass-card">
          <div class="card-header">
            <span class="card-title"><span class="icon">⚙️</span> AI配置</span>
          </div>
          <div style="max-width:500px;">
            <div class="form-group">
              <label class="form-label">扣子 API Key</label>
              <input type="password" class="form-input" id="coze-api-key" value="${config.coze_api_key || ''}" placeholder="pat_xxx">
              <small style="color:var(--text-tertiary);margin-top:6px;display:block;">当前: ${config.coze_api_key_masked || '未设置'}</small>
            </div>
            <div class="form-group">
              <label class="form-label">扣子 Bot ID</label>
              <input type="text" class="form-input" id="coze-bot-id" value="${config.coze_bot_id || ''}" placeholder="输入Bot ID">
            </div>
            <div style="display:flex;gap:12px;">
              <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
              <button class="btn btn-secondary" onclick="testConfig()">测试连接</button>
            </div>
          </div>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <span class="card-title"><span class="icon">💡</span> 配置说明</span>
          </div>
          <div style="color:var(--text-secondary);line-height:2;font-size:14px;">
            <p>• API Key 和 Bot ID 请到 <a href="https://coze.cn" target="_blank" style="color:var(--accent-cyan);">扣子平台</a> 获取</p>
            <p>• 配置后系统将自动使用AI回复客户消息</p>
            <p>• 建议同时配置知识库以提高回复准确率</p>
            <p>• 服务价格：<strong style="color:var(--accent-cyan);">¥49/月</strong></p>
          </div>
        </div>
      `;
    }

    // ============== 知识库 ==============
    function renderKnowledge() {
      return `
        <div class="glass-card">
          <div class="card-header">
            <span class="card-title"><span class="icon">📚</span> 知识库</span>
            <button class="btn btn-primary">+ 添加知识</button>
          </div>
          <div class="empty-state">
            <div class="icon">📚</div>
            <p>知识库功能开发中...</p>
            <small>可以手动编辑 knowledge-base 目录下的文件</small>
          </div>
        </div>
      `;
    }

    // ============== 数据分析 ==============
    async function loadAnalytics() {
      try {
        const res = await fetch('/api/analytics/dashboard');
        const data = await res.json();
        analyticsData = data.data || {};
      } catch (e) { console.error(e); }
    }

    function renderAnalytics() {
      const a = analyticsData;
      return `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon cyan">💬</div>
            <div class="stat-value">${a.total_messages || 0}</div>
            <div class="stat-label">总消息数</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple">👥</div>
            <div class="stat-value">${a.total_customers || 0}</div>
            <div class="stat-label">总客户数</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">📈</div>
            <div class="stat-value">${a.reply_rate || '0%'}</div>
            <div class="stat-label">回复率</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon pink">⏱️</div>
            <div class="stat-value">${a.avg_response_time || '0s'}</div>
            <div class="stat-label">平均响应</div>
          </div>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <span class="card-title"><span class="icon">📊</span> 平台分析</span>
          </div>
          <div class="platform-grid">
            ${Object.entries(a.platforms || {}).map(([platform, data]) => `
              <div class="platform-card connected">
                <div class="platform-header">
                  <div class="platform-info">
                    <div class="platform-icon">${getPlatformIcon(platform)}</div>
                    <div>
                      <div class="platform-name">${getPlatformName(platform)}</div>
                      <div class="platform-sub">活跃平台</div>
                    </div>
                  </div>
                </div>
                <div class="platform-stats">
                  <div class="platform-stat">
                    <div class="platform-stat-value">${data.messages || 0}</div>
                    <div class="platform-stat-label">消息数</div>
                  </div>
                  <div class="platform-stat">
                    <div class="platform-stat-value">${data.customers || 0}</div>
                    <div class="platform-stat-label">客户数</div>
                  </div>
                  <div class="platform-stat">
                    <div class="platform-stat-value">${Object.keys(data.keywords || {}).length}</div>
                    <div class="platform-stat-label">关键词</div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <span class="card-title"><span class="icon">📈</span> 趋势分析</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px;">
            <div style="background:rgba(0,0,0,0.3);border-radius:16px;padding:24px;text-align:center;">
              <div style="font-size:32px;font-weight:700;color:var(--accent-cyan);">${a.trends?.messages_trend?.[6] || 0}</div>
              <div style="color:var(--text-secondary);margin-top:8px;">本周消息</div>
            </div>
            <div style="background:rgba(0,0,0,0.3);border-radius:16px;padding:24px;text-align:center;">
              <div style="font-size:32px;font-weight:700;color:var(--accent-purple);">${a.trends?.customers_trend?.[6] || 0}</div>
              <div style="color:var(--text-secondary);margin-top:8px;">本周新客</div>
            </div>
          </div>
        </div>
      `;
    }

    // ============== 客户管理 ==============
    async function loadCustomers() {
      try {
        const [customersRes, leadsRes, statsRes] = await Promise.all([
          fetch('/api/customers'),
          fetch('/api/leads'),
          fetch('/api/acquisition/stats')
        ]);
        const customersDataRes = await customersRes.json();
        const leadsDataRes = await leadsRes.json();
        const statsDataRes = await statsRes.json();
        customersData = {
          customers: customersDataRes.data?.customers || [],
          leads: leadsDataRes.data?.leads || [],
          stats: statsDataRes.data || {}
        };
      } catch (e) { console.error(e); }
    }

    function renderCustomers() {
      const s = customersData.stats || {};
      return `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon cyan">👥</div>
            <div class="stat-value">${s.total_customers || 0}</div>
            <div class="stat-label">总客户数</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple">🔥</div>
            <div class="stat-value">${s.hot_leads || 0}</div>
            <div class="stat-label">高意向客户</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon pink">🌡️</div>
            <div class="stat-value">${s.warm_leads || 0}</div>
            <div class="stat-label">意向客户</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">🎯</div>
            <div class="stat-value">${s.total_leads || 0}</div>
            <div class="stat-label">销售线索</div>
          </div>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <span class="card-title"><span class="icon">🔥</span> 高意向线索</span>
          </div>
          <div class="platform-grid">
            ${customersData.leads.filter(l => l.score >= 80).length === 0 ? `
              <div class="empty-state" style="grid-column:1/-1;">
                <div class="icon">🔥</div>
                <p>暂无高意向线索</p>
                <small>当客户评分达到80分以上时将自动显示在这里</small>
              </div>
            ` : customersData.leads.filter(l => l.score >= 80).map(lead => `
              <div class="platform-card connected">
                <div class="platform-header">
                  <div class="platform-info">
                    <div class="platform-icon">${getPlatformIcon(lead.platform)}</div>
                    <div>
                      <div class="platform-name">${lead.user_name || '未知用户'}</div>
                      <div class="platform-sub">${getPlatformName(lead.platform)} · 评分 ${lead.score}</div>
                    </div>
                  </div>
                  <span class="platform-status connected">${lead.type === 'purchase' ? '已购买' : '高意向'}</span>
                </div>
                <div class="platform-actions">
                  <button class="btn btn-sm btn-secondary" onclick="updateLeadStatus('${lead.id}', 'contacted')">联系</button>
                  <button class="btn btn-sm btn-danger" onclick="updateLeadStatus('${lead.id}', 'converted')">成交</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <span class="card-title"><span class="icon">👥</span> 全部客户</span>
            <button class="btn btn-sm btn-primary" onclick="loadCustomers()">刷新</button>
          </div>
          <div class="platform-grid">
            ${customersData.customers.length === 0 ? `
              <div class="empty-state" style="grid-column:1/-1;">
                <div class="icon">👥</div>
                <p>暂无客户数据</p>
                <small>开始使用后客户将自动显示在这里</small>
              </div>
            ` : customersData.customers.slice(0, 6).map(c => `
              <div class="platform-card">
                <div class="platform-header">
                  <div class="platform-info">
                    <div class="platform-icon">${getPlatformIcon(c.platform)}</div>
                    <div>
                      <div class="platform-name">${c.user_name || '未知用户'}</div>
                      <div class="platform-sub">评分 ${c.score || 0}</div>
                    </div>
                  </div>
                  <span class="platform-status">${c.status || '活跃'}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    async function updateLeadStatus(leadId, status) {
      try {
        await fetch(`/api/leads/${leadId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        showToast('状态已更新', 'success');
        loadCustomers();
      } catch (e) { showToast('更新失败', 'error'); }
    }

    // ============== 工具函数 ==============
    function getPlatformIcon(platform) {
      return { douyin: '🐦', xianyu: '🐟', qianiu: '🐱', kuaishou: '📺', pinduoduo: '🛒' }[platform] || '🏪';
    }
    function getPlatformName(platform) {
      return { douyin: '抖店', xianyu: '闲鱼', qianiu: '淘宝千牛', kuaishou: '快手', pinduoduo: '拼多多' }[platform] || platform;
    }

    // ============== 动画数字 ==============
    function animateStats() {
      document.querySelectorAll('.stat-value[data-count]').forEach(el => {
        const target = parseInt(el.dataset.count);
        if (target > 0) {
          el.textContent = target;
          el.style.animation = 'none';
          el.offsetHeight;
          el.style.animation = 'count-up 0.6s ease-out';
        }
      });
    }

    // ============== 弹窗操作 ==============
    function openModal() {
      selectedPlatform = null;
      document.querySelectorAll('.platform-option').forEach(el => el.classList.remove('selected'));
      document.getElementById('store-name').value = '';
      document.getElementById('modal').classList.add('show');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }
    function selectPlatform(el) {
      document.querySelectorAll('.platform-option').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
      selectedPlatform = el.dataset.platform;
    }

    // ============== 数据操作 ==============
    async function addStore() {
      if (!selectedPlatform) { showToast('请选择平台', 'error'); return; }
      const name = document.getElementById('store-name').value.trim();
      if (!name) { showToast('请输入店铺名称', 'error'); return; }
      try {
        const res = await fetch('/api/stores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, platform: selectedPlatform, config: {} })
        });
        const data = await res.json();
        if (data.code === 0) {
          closeModal();
          await loadStores();
          showToast('添加成功', 'success');
        } else {
          showToast(data.msg || '添加失败', 'error');
        }
      } catch (e) { showToast('添加失败', 'error'); }
    }

    async function deleteStore(id) {
      if (!confirm('确定删除？')) return;
      try {
        await fetch(`/api/stores/${id}`, { method: 'DELETE' });
        await loadStores();
        showToast('已删除', 'success');
      } catch (e) { showToast('删除失败', 'error'); }
    }

    async function toggleStore(id) {
      try {
        await fetch(`/api/stores/${id}/toggle`, { method: 'PUT' });
        await loadStores();
      } catch (e) { showToast('操作失败', 'error'); }
    }

    async function saveConfig() {
      const apiKey = document.getElementById('coze-api-key').value.trim();
      const botId = document.getElementById('coze-bot-id').value.trim();
      try {
        await fetch('/api/config', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ coze_api_key: apiKey, coze_bot_id: botId })
        });
        await loadConfig();
        showToast('配置已保存', 'success');
      } catch (e) { showToast('保存失败', 'error'); }
    }

    async function testConfig() {
      showToast('测试连接功能开发中...', 'success');
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ============== 事件绑定 ==============
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => showPage(item.dataset.page));
    });

    // 启动
    init();
  </script>
</body>
</html>
