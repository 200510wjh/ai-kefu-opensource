<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI客服 - 登录</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0a0b14;
      --bg-secondary: #12131f;
      --accent-cyan: #00d4ff;
      --accent-purple: #7b5cfa;
      --accent-pink: #ff6b9d;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    body {
      font-family: 'Inter', 'Space Grotesk', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .particles-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--accent-cyan);
      opacity: 0.3;
      animation: float 15s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.1); }
    }

    .gradient-orb {
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
    }
    .orb-1 {
      background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
      top: -200px; left: -200px;
    }
    .orb-2 {
      background: radial-gradient(circle, rgba(123, 92, 250, 0.12) 0%, transparent 70%);
      bottom: -200px; right: -200px;
    }

    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .auth-card {
      background: rgba(18, 19, 31, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      padding: 48px 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
    }
    .logo h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 32px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-secondary);
    }
    .tab.active {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: white;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }
    .form-input::placeholder { color: rgba(255, 255, 255, 0.3); }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: white;
      box-shadow: 0 4px 24px rgba(0, 212, 255, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 212, 255, 0.5);
    }
    .btn-primary:active { transform: scale(0.98); }

    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }
    .divider span { padding: 0 16px; }

    .pricing {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .pricing-price {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--accent-cyan);
    }
    .pricing-period {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .pricing-features {
      list-style: none;
      margin-top: 16px;
      text-align: left;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .pricing-features li {
      padding: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pricing-features li::before {
      content: '✓';
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--bg-secondary);
      border: 1px solid var(--accent-cyan);
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      color: var(--accent-cyan);
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 2000;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.error {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="particles-bg" id="particles"></div>
  <div class="gradient-orb orb-1"></div>
  <div class="gradient-orb orb-2"></div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <div class="logo-icon">🤖</div>
        <h1>AI客服</h1>
        <p>多平台智能客服系统</p>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="login">登录</div>
        <div class="tab" data-tab="register">注册</div>
      </div>

      <!-- 登录表单 -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">手机号 / 用户名</label>
          <input type="text" class="form-input" id="login-username" placeholder="输入手机号或用户名" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="login-password" placeholder="输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary">登录</button>
      </form>

      <!-- 注册表单 -->
      <form id="register-form" class="hidden">
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input type="tel" class="form-input" id="reg-phone" placeholder="输入手机号" required>
        </div>
        <div class="form-group">
          <label class="form-label">设置密码</label>
          <input type="password" class="form-input" id="reg-password" placeholder="设置密码（6位以上）" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">确认密码</label>
          <input type="password" class="form-input" id="reg-password-confirm" placeholder="再次输入密码" required>
        </div>
        <div class="form-group">
          <label class="form-label">验证码</label>
          <div style="display:flex;gap:10px;">
            <input type="text" class="form-input" id="reg-code" placeholder="输入验证码" required style="flex:1;">
            <button type="button" class="btn btn-primary" style="width:auto;padding:14px 20px;" id="send-code">获取验证码</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">立即注册</button>
      </form>

      <div class="divider"><span>¥49/月</span></div>

      <div class="pricing">
        <div class="pricing-price">¥49 <span class="pricing-period">/月</span></div>
        <ul class="pricing-features">
          <li>支持抖店/千牛/快手/拼多多</li>
          <li>AI智能回复，永不离线</li>
          <li>专属客服支持</li>
          <li>持续更新功能</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 创建粒子背景
    const container = document.getElementById('particles');
    for (let i = 0; i < 15; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.cssText = `
        width: ${Math.random() * 4 + 2}px;
        height: ${Math.random() * 4 + 2}px;
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 100}%;
        animation-delay: ${Math.random() * 15}s;
        background: ${['#00d4ff', '#7b5cfa', '#ff6b9d'][Math.floor(Math.random() * 3)]};
      `;
      container.appendChild(particle);
    }

    // Tab切换
    const tabs = document.querySelectorAll('.tab');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        if (tab.dataset.tab === 'login') {
          loginForm.classList.remove('hidden');
          registerForm.classList.add('hidden');
        } else {
          loginForm.classList.add('hidden');
          registerForm.classList.remove('hidden');
        }
      });
    });

    // 登录
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (data.code === 0) {
          localStorage.setItem('token', data.data.token);
          localStorage.setItem('user', JSON.stringify(data.data.user));
          showToast('登录成功！正在跳转...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          showToast(data.msg || '登录失败', 'error');
        }
      } catch (e) {
        showToast('网络错误，请稍后重试', 'error');
      }
    });

    // 注册
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;
      const passwordConfirm = document.getElementById('reg-password-confirm').value;
      const code = document.getElementById('reg-code').value;

      if (password !== passwordConfirm) {
        showToast('两次密码输入不一致', 'error');
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password, code })
        });
        const data = await res.json();
        
        if (data.code === 0) {
          showToast('注册成功！请登录', 'success');
          setTimeout(() => {
            tabs[0].click();
          }, 1000);
        } else {
          showToast(data.msg || '注册失败', 'error');
        }
      } catch (e) {
        showToast('网络错误，请稍后重试', 'error');
      }
    });

    // 发送验证码
    document.getElementById('send-code').addEventListener('click', async () => {
      const phone = document.getElementById('reg-phone').value;
      if (!phone || phone.length !== 11) {
        showToast('请输入正确的手机号', 'error');
        return;
      }
      
      const btn = document.getElementById('send-code');
      btn.disabled = true;
      btn.textContent = '发送中...';
      
      try {
        await fetch('/api/auth/send-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });
        showToast('验证码已发送', 'success');
        
        let countdown = 60;
        const timer = setInterval(() => {
          btn.textContent = `${countdown}s后重试`;
          countdown--;
          if (countdown < 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = '获取验证码';
          }
        }, 1000);
      } catch (e) {
        showToast('发送失败，请稍后重试', 'error');
        btn.disabled = false;
        btn.textContent = '获取验证码';
      }
    });

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
