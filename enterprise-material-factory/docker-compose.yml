services:
  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://factory:factory@postgres:5432/material_factory
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: material-factory
      MINIO_ACCESS_KEY: factory
      MINIO_SECRET_KEY: factory-secret
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./backend/data:/app/data

  worker:
    build:
      context: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://factory:factory@postgres:5432/material_factory
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: minio
    depends_on:
      - api
      - redis

  frontend:
    build:
      context: ./frontend
    command: npm run dev
    ports:
      - "5174:5174"
    depends_on:
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: material_factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
